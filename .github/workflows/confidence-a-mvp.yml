name: Confidence A MVP tests

on:
  push:
    paths:
      - 'modules/confidence_a_mvp/**'
      - '.github/workflows/confidence-a-mvp.yml'
  pull_request:
    paths:
      - 'modules/confidence_a_mvp/**'
      - '.github/workflows/confidence-a-mvp.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: modules/confidence_a_mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
